<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TeamAI 控制台</title>
<style>
  :root {
    --accent: #6366f1; --accent2: #8b5cf6;
    --bg: #f4f6fb; --card: #ffffff; --line: #e8eaf2;
    --text: #1e2430; --text2: #7a8194;
    --ok: #16a34a; --err: #dc2626; --warn: #d97706;
    --sidebar: #111627; --sidebar-on: rgba(99,102,241,.16);
    --radius: 12px;
    --shadow: 0 1px 3px rgba(30,36,48,.06), 0 4px 14px rgba(30,36,48,.05);
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #cfd4e0; border-radius: 4px; }

  /* ---------- 登录 ---------- */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 500px at 20% 0%, #e0e7ff 0%, transparent 60%),
                radial-gradient(900px 400px at 90% 100%, #ede9fe 0%, transparent 55%), var(--bg); }
  .login-card { width: 380px; background: var(--card); border-radius: 16px; padding: 36px 32px; box-shadow: 0 8px 40px rgba(30,36,48,.10); }
  .login-logo { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 6px; }
  .login-logo .mark { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 18px; }
  .login-logo b { font-size: 20px; }
  .login-sub { text-align: center; color: var(--text2); font-size: 13px; margin-bottom: 24px; }

  /* ---------- 布局 ---------- */
  .shell { display: flex; min-height: 100vh; }
  .side { width: 216px; background: var(--sidebar); color: #aab1c5; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; flex-shrink: 0; }
  .side .brand { display: flex; align-items: center; gap: 10px; padding: 20px 18px; color: #fff; font-weight: 600; font-size: 16px; }
  .side .brand .mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .nav { padding: 8px; flex: 1; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; margin-bottom: 2px; transition: background .15s, color .15s; }
  .nav-item:hover { background: rgba(255,255,255,.06); color: #dfe3ee; }
  .nav-item.on { background: var(--sidebar-on); color: #c7cbff; font-weight: 500; }
  .nav-item::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .45; flex-shrink: 0; }
  .nav-item.on::before { opacity: 1; }
  .side .me { padding: 14px 18px; border-top: 1px solid rgba(255,255,255,.07); font-size: 13px; }
  .side .me .name { color: #fff; font-weight: 500; }
  .side .me .out { color: #8b93ab; cursor: pointer; margin-left: 8px; }
  .side .me .out:hover { color: #fff; }

  .main { flex: 1; padding: 24px 28px; max-width: calc(100vw - 216px); }
  .page-title { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .page-sub { color: var(--text2); font-size: 13px; margin-bottom: 20px; }

  /* ---------- 组件 ---------- */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 16px; }
  .card h3 { font-size: 15px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .card h3 .sub { font-weight: 400; font-size: 12px; color: var(--text2); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 16px; }
  .stat { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; position: relative; overflow: hidden; }
  .stat::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, var(--accent), var(--accent2)); }
  .stat .n { font-size: 26px; font-weight: 700; letter-spacing: -.5px; }
  .stat .t { font-size: 12px; color: var(--text2); margin-top: 2px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--line); }
  th { color: var(--text2); font-weight: 500; font-size: 12px; }
  tbody tr { transition: background .12s; }
  tbody tr:hover { background: #f8f9fd; }
  tbody tr:last-child td { border-bottom: none; }
  .empty { text-align: center; color: var(--text2); padding: 32px 0; font-size: 13px; }

  input, select, textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; background: #fff; color: var(--text); transition: border-color .15s, box-shadow .15s; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,.12); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .row .field { display: flex; flex-direction: column; gap: 4px; }
  .row .field label { font-size: 12px; color: var(--text2); }
  .row input, .row select { width: auto; min-width: 150px; }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: none; border-radius: 8px; font-size: 13px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-weight: 500; transition: opacity .15s, transform .05s; }
  .btn:hover { opacity: .92; } .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .btn.ghost { background: #fff; color: var(--accent); border: 1px solid #d5d9f5; }
  .btn.ghost:hover { background: #f5f6ff; }
  .btn.danger { background: #fff; color: var(--err); border: 1px solid #f3c2c2; }
  .btn.danger:hover { background: #fef2f2; }
  .btn.sm { padding: 4px 10px; font-size: 12px; border-radius: 6px; }

  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 12px; background: #eef0f6; color: var(--text2); }
  .tag.on { background: #e8f7ee; color: var(--ok); }
  .tag.off { background: #fdecec; color: var(--err); }
  .tag.run { background: #e8f7ee; color: var(--ok); }
  .tag.run::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px; }
  .hint { font-size: 12px; color: var(--text2); margin-top: 10px; line-height: 1.6; }
  .copy { cursor: pointer; color: var(--accent); }
  .copy:hover { text-decoration: underline; }

  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(99,102,241,.25); border-top-color: var(--accent); border-radius: 50%; animation: rot .7s linear infinite; vertical-align: -2px; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .loading { padding: 40px 0; text-align: center; color: var(--text2); }

  .logbox { background: #0d1220; color: #7ee787; border-radius: 10px; padding: 14px 16px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; line-height: 1.7; max-height: 360px; overflow: auto; white-space: pre-wrap; word-break: break-all; }

  /* ---------- Toast ---------- */
  #toasts { position: fixed; top: 18px; right: 18px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
  .toast { min-width: 240px; max-width: 380px; background: #fff; border-radius: 10px; box-shadow: 0 6px 24px rgba(30,36,48,.14); padding: 12px 16px; font-size: 13px;
    display: flex; gap: 10px; align-items: flex-start; border-left: 3px solid var(--accent); animation: slidein .25s ease; }
  .toast.ok { border-left-color: var(--ok); } .toast.err { border-left-color: var(--err); }
  .toast .tdot { flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; background: var(--accent); }
  .toast.ok .tdot { background: var(--ok); } .toast.err .tdot { background: var(--err); }
  .toast.hide { animation: slideout .25s ease forwards; }
  @keyframes slidein { from { transform: translateX(30px); opacity: 0; } }
  @keyframes slideout { to { transform: translateX(30px); opacity: 0; } }

  /* ---------- Modal ---------- */
  .mask { position: fixed; inset: 0; background: rgba(15,20,35,.45); backdrop-filter: blur(2px); z-index: 900; display: flex; align-items: center; justify-content: center; animation: fadein .18s; }
  @keyframes fadein { from { opacity: 0; } }
  .modal { background: #fff; border-radius: 14px; width: 440px; max-width: calc(100vw - 40px); max-height: 85vh; overflow: auto; box-shadow: 0 16px 60px rgba(15,20,35,.3); animation: pop .18s ease; }
  @keyframes pop { from { transform: scale(.96) translateY(8px); opacity: 0; } }
  .modal .m-head { padding: 16px 20px 0; font-size: 15px; font-weight: 600; }
  .modal .m-body { padding: 14px 20px; font-size: 13px; color: var(--text); }
  .modal .m-body .field { margin-bottom: 12px; }
  .modal .m-body label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 5px; }
  .modal .m-foot { padding: 0 20px 16px; display: flex; justify-content: flex-end; gap: 10px; }
  .key-show { background: #f6f7fb; border: 1px dashed #c9cee0; border-radius: 8px; padding: 10px 12px; font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; margin-top: 10px; }
  .bar { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 14px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>
<div id="modal-root"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtTime = (ts) => new Date(ts).toLocaleString("zh-CN", { hour12: false });

let token = localStorage.getItem("teamai_admin_token") || "";
let me = null;
let tab = "usage";
const state = { testResults: {} };

/* ---------- Toast ---------- */
function toast(text, type = "ok", ms = 2600) {
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.innerHTML = `<span class="tdot"></span><div>${esc(text)}</div>`;
  $("#toasts").appendChild(el);
  setTimeout(() => { el.classList.add("hide"); setTimeout(() => el.remove(), 260); }, ms);
}

/* ---------- Modal ---------- */
function openModal({ title, body, okText = "确定", danger = false, onOk }) {
  const root = $("#modal-root");
  root.innerHTML = `
    <div class="mask">
      <div class="modal">
        <div class="m-head">${esc(title)}</div>
        <div class="m-body"></div>
        <div class="m-foot">
          <button class="btn ghost" data-act="cancel">取消</button>
          <button class="btn ${danger ? "danger" : ""}" data-act="ok">${esc(okText)}</button>
        </div>
      </div>
    </div>`;
  const bodyEl = $(".m-body", root);
  if (typeof body === "string") bodyEl.innerHTML = body; else bodyEl.appendChild(body);
  const close = () => (root.innerHTML = "");
  $(".mask", root).addEventListener("click", (e) => { if (e.target.classList.contains("mask")) close(); });
  $('[data-act="cancel"]', root).onclick = close;
  $('[data-act="ok"]', root).onclick = async () => {
    const okBtn = $('[data-act="ok"]', root);
    okBtn.disabled = true;
    try { if ((await onOk?.(bodyEl)) !== false) close(); }
    catch (e) { toast(e.message, "err", 3600); }
    finally { okBtn.disabled = false; }
  };
}
function confirmBox(title, text, onOk, okText = "确定", danger = true) {
  openModal({ title, body: `<p style="line-height:1.7">${esc(text)}</p>`, okText, danger, onOk });
}
function field(label, inner) {
  return `<div class="field"><label>${esc(label)}</label>${inner}</div>`;
}

/* ---------- API ---------- */
async function req(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "content-type": "application/json", authorization: `Bearer ${token}`, ...(opts.headers || {}) },
  });
  if (res.status === 401) { logout(); throw new Error("登录已过期，请重新登录"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `请求失败（${res.status}）`);
  return data;
}

function logout() {
  token = ""; me = null;
  localStorage.removeItem("teamai_admin_token");
  renderLogin();
}

/* ---------- 登录 ---------- */
function renderLogin() {
  $("#app").innerHTML = `
    <div class="login-wrap"><div class="login-card">
      <div class="login-logo"><div class="mark">T</div><b>TeamAI 控制台</b></div>
      <div class="login-sub">服务端管理入口 · 建议仅在内网访问</div>
      <div class="field" style="margin-bottom:12px"><label style="font-size:12px;color:var(--text2);display:block;margin-bottom:5px">邮箱</label><input id="email" placeholder="admin@teamai.local" /></div>
      <div class="field" style="margin-bottom:18px"><label style="font-size:12px;color:var(--text2);display:block;margin-bottom:5px">密码</label><input id="pw" type="password" placeholder="••••••" /></div>
      <button class="btn" style="width:100%;justify-content:center" id="login-btn">登 录</button>
      <div style="color:var(--err);font-size:12px;margin-top:10px;min-height:16px;text-align:center" id="err"></div>
    </div></div>`;
  $("#pw").addEventListener("keydown", (e) => e.key === "Enter" && doLogin());
  $("#email").addEventListener("keydown", (e) => e.key === "Enter" && $("#pw").focus());
  $("#login-btn").onclick = doLogin;
  $("#email").focus();
}

async function doLogin() {
  const btn = $("#login-btn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> 登录中…';
  $("#err").textContent = "";
  try {
    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ email: $("#email").value.trim(), password: $("#pw").value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "登录失败");
    if (data.user?.role !== "admin") throw new Error("该账号不是管理员，无法进入控制台");
    token = data.token; me = data.user;
    localStorage.setItem("teamai_admin_token", token);
    toast(`欢迎回来，${me.name}`);
    renderMain();
  } catch (e) {
    $("#err").textContent = e.message;
    btn.disabled = false;
    btn.textContent = "登 录";
  }
}

/* ---------- 主框架 ---------- */
const NAV = [
  ["usage", "用量总览"],
  ["providers", "模型 Provider"],
  ["keys", "虚拟 Key"],
  ["users", "成员"],
  ["repos", "Git 仓库"],
  ["envs", "在线环境"],
  ["audit", "审计日志"],
];

function renderMain() {
  $("#app").innerHTML = `
    <div class="shell">
      <aside class="side">
        <div class="brand"><div class="mark">T</div>TeamAI</div>
        <nav class="nav">${NAV.map(([k, n]) =>
          `<div class="nav-item ${k === tab ? "on" : ""}" data-nav="${k}">${n}</div>`).join("")}
        </nav>
        <div class="me"><span class="name">${esc(me.name)}</span> · ${esc(me.role)}<span class="out" id="logout">退出</span></div>
      </aside>
      <main class="main"><div id="content"><div class="loading"><span class="spin"></span> 加载中…</div></div></main>
    </div>`;
  $$(".nav-item").forEach((el) => (el.onclick = () => { tab = el.dataset.nav; renderMain(); }));
  $("#logout").onclick = () => confirmBox("退出登录", "确定退出控制台吗？", () => { logout(); }, "退出");
  void renderTab();
}

async function renderTab() {
  const c = $("#content");
  c.innerHTML = '<div class="loading"><span class="spin"></span> 加载中…</div>';
  try {
    if (tab === "usage") await renderUsage(c);
    else if (tab === "providers") await renderProviders(c);
    else if (tab === "keys") await renderKeys(c);
    else if (tab === "users") await renderUsers(c);
    else if (tab === "repos") await renderRepos(c);
    else if (tab === "envs") await renderEnvs(c);
    else if (tab === "audit") await renderAudit(c);
  } catch (e) { c.innerHTML = `<div class="card empty">${esc(e.message)}</div>`; }
}

const pageHead = (t, s) => `<div class="page-title">${t}</div><div class="page-sub">${s}</div>`;

/* ---------- 用量 ---------- */
async function renderUsage(c) {
  const s = await req("/api/usage/summary");
  const rows = Object.entries(s.byModel).map(([m, v]) =>
    `<tr><td class="mono">${esc(m)}</td><td>${v.tokensIn.toLocaleString()}</td><td>${v.tokensOut.toLocaleString()}</td><td><b>${(v.tokensIn + v.tokensOut).toLocaleString()}</b></td></tr>`).join("");
  const urows = Object.entries(s.byUser ?? {}).map(([u, v]) =>
    `<tr><td class="mono">${esc(u.slice(0, 8))}…</td><td>${v.tokensIn.toLocaleString()}</td><td>${v.tokensOut.toLocaleString()}</td></tr>`).join("");
  c.innerHTML = `
    ${pageHead("用量总览", "网关全部调用的 token 统计，实时落库")}
    <div class="stats">
      <div class="stat"><div class="n">${s.totalTokensIn.toLocaleString()}</div><div class="t">输入 Tokens</div></div>
      <div class="stat"><div class="n">${s.totalTokensOut.toLocaleString()}</div><div class="t">输出 Tokens</div></div>
      <div class="stat"><div class="n">${(s.totalTokensIn + s.totalTokensOut).toLocaleString()}</div><div class="t">总 Tokens</div></div>
      <div class="stat"><div class="n">${s.totalCost.toFixed(4)}</div><div class="t">估算成本</div></div>
    </div>
    <div class="card"><h3>按模型</h3>
      <table><thead><tr><th>模型</th><th>输入</th><th>输出</th><th>合计</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="4" class="empty">暂无调用数据</td></tr>'}</tbody></table>
    </div>
    <div class="card"><h3>按成员</h3>
      <table><thead><tr><th>成员 ID</th><th>输入</th><th>输出</th></tr></thead>
      <tbody>${urows || '<tr><td colspan="3" class="empty">暂无数据</td></tr>'}</tbody></table>
    </div>`;
}

/* ---------- Provider ---------- */
async function renderProviders(c) {
  const { providers } = await req("/api/admin/providers");
  const rows = providers.map((p) => {
    const t = state.testResults[p.id];
    return `
    <tr>
      <td><b>${esc(p.name)}</b></td>
      <td><span class="tag">${esc(p.type)}</span></td>
      <td class="mono">${esc(p.baseUrl)}</td>
      <td>${p.models.map((m) => `<span class="tag" style="margin:1px 2px">${esc(m)}</span>`).join("") || '<i style="color:var(--text2)">全部模型</i>'}</td>
      <td><span class="tag ${p.enabled ? "on" : "off"}">${p.enabled ? "启用" : "停用"}</span></td>
      <td>
        <button class="btn sm ghost" data-act="test" data-id="${p.id}" data-name="${esc(p.name)}">${t?.loading ? '<span class="spin"></span>' : "测试"}</button>
        <button class="btn sm ghost" data-act="edit" data-id="${p.id}" data-name="${esc(p.name)}" data-models="${esc(p.models.join(","))}">编辑模型</button>
        <button class="btn sm ghost" data-act="toggle" data-id="${p.id}" data-enabled="${p.enabled ? 0 : 1}">${p.enabled ? "停用" : "启用"}</button>
        <button class="btn sm danger" data-act="del" data-id="${p.id}" data-name="${esc(p.name)}">删除</button>
      </td>
    </tr>
    ${t && !t.loading ? `<tr><td colspan="6" style="background:#f8f9fd">
      ${t.ok
        ? `<span class="tag on">连通正常 · ${t.latencyMs}ms</span> ${t.models?.length ? `拉取到 <b>${t.models.length}</b> 个模型 <button class="btn sm" data-act="save-models" data-id="${p.id}">保存为模型列表</button>` : "（上游未返回模型列表）"}`
        : `<span class="tag off">连通失败 · ${t.latencyMs ?? 0}ms</span> <span class="mono" style="color:var(--err)">${esc(t.error ?? "")}</span>`}
    </td></tr>` : ""}`;
  }).join("");
  c.innerHTML = `
    ${pageHead("模型 Provider", "接入上游大模型 API，真实 Key 加密后仅存服务端")}
    <div class="bar"><button class="btn" id="add-provider">添加 Provider</button></div>
    <div class="card"><h3>Provider 列表 <span class="sub">${providers.length} 个</span></h3>
      <table><thead><tr><th>名称</th><th>类型</th><th>Base URL</th><th>模型</th><th>状态</th><th>操作</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6" class="empty">还没有 Provider，点击右上角「添加 Provider」接入</td></tr>'}</tbody></table>
      <div class="hint">客户端与 CLI 的 BASE_URL 指向本服务的 <span class="mono">${location.origin}/v1</span>，用虚拟 Key 鉴权即可，无需接触真实 Key。</div>
    </div>`;

  $("#add-provider").onclick = () => {
    openModal({
      title: "添加 Provider",
      okText: "添加",
      body:
        field("名称", '<input id="m-p-name" placeholder="如 deepseek" />') +
        field("协议类型", `<select id="m-p-type">
          <option value="openai-compatible">OpenAI 兼容（DeepSeek / GLM / Qwen / Moonshot…）</option>
          <option value="anthropic">Anthropic</option>
          <option value="gemini">Gemini</option>
        </select>`) +
        field("Base URL", '<input id="m-p-url" placeholder="https://api.deepseek.com" />') +
        field("真实 API Key", '<input id="m-p-key" type="password" placeholder="sk-…" />') +
        field("模型（逗号分隔，空 = 全部）", '<input id="m-p-models" placeholder="deepseek-chat,deepseek-reasoner" />'),
      onOk: async (b) => {
        const name = $("#m-p-name", b).value.trim();
        const baseUrl = $("#m-p-url", b).value.trim();
        const apiKey = $("#m-p-key", b).value;
        if (!name || !baseUrl || !apiKey) { toast("名称、Base URL、API Key 均必填", "err"); return false; }
        await req("/api/admin/providers", {
          method: "POST",
          body: JSON.stringify({
            name, type: $("#m-p-type", b).value, baseUrl, apiKey,
            models: $("#m-p-models", b).value.split(",").map((s) => s.trim()).filter(Boolean),
          }),
        });
        toast("Provider 已添加");
        renderTab();
      },
    });
  };
  $$("[data-act]", c).forEach((btn) => (btn.onclick = () => {
    const { act, id, name, enabled } = btn.dataset;
    if (act === "edit") {
      openModal({
        title: `编辑模型：${name}`,
        okText: "保存",
        body: field("模型（逗号分隔，空 = 全部）", `<input id="m-edit-models" value="${btn.dataset.models}" placeholder="留空表示转发全部模型" />`),
        onOk: async (b) => {
          const models = $("#m-edit-models", b).value.split(",").map((s) => s.trim()).filter(Boolean);
          await req(`/api/admin/providers/${id}`, { method: "PATCH", body: JSON.stringify({ models }) });
          toast(models.length ? `已保存 ${models.length} 个模型` : "已改为转发全部模型");
          renderTab();
        },
      });
    } else if (act === "toggle") {
      req(`/api/admin/providers/${id}`, { method: "PATCH", body: JSON.stringify({ enabled: enabled === "1" }) })
        .then(() => { toast(enabled === "1" ? "已启用" : "已停用"); renderTab(); })
        .catch((e) => toast(e.message, "err"));
    } else if (act === "del") {
      confirmBox("删除 Provider", `删除「${name}」？关联模型将立即不可用。`, async () => {
        await req(`/api/admin/providers/${id}`, { method: "DELETE" });
        toast("已删除");
        renderTab();
      }, "删除");
    } else if (act === "test") {
      state.testResults[id] = { loading: true };
      renderTab();
      req(`/api/admin/providers/${id}/test`, { method: "POST" })
        .then((r) => { state.testResults[id] = r; renderTab(); })
        .catch((e) => { state.testResults[id] = { ok: false, error: e.message }; renderTab(); });
    } else if (act === "save-models") {
      const models = state.testResults[id]?.models ?? [];
      req(`/api/admin/providers/${id}`, { method: "PATCH", body: JSON.stringify({ models }) })
        .then(() => { toast(`已保存 ${models.length} 个模型`); delete state.testResults[id]; renderTab(); })
        .catch((e) => toast(e.message, "err"));
    }
  }));
}

/* ---------- 虚拟 Key ---------- */
async function renderKeys(c) {
  const { keys } = await req("/api/admin/keys");
  const rows = keys.map((k) => `
    <tr>
      <td class="mono">${esc(k.key.slice(0, 14))}…</td>
      <td>${esc(k.name || "-")}</td>
      <td>${k.quota_tokens != null ? k.quota_tokens.toLocaleString() : "不限"}</td>
      <td><span class="tag ${k.revoked_at ? "off" : "on"}">${k.revoked_at ? "已吊销" : "有效"}</span></td>
      <td>${fmtTime(k.created_at)}</td>
      <td>${k.revoked_at ? "" : `<button class="btn sm danger" data-revoke="${k.id}">吊销</button>`}</td>
    </tr>`).join("");
  c.innerHTML = `
    ${pageHead("虚拟 Key", "分发给成员或 CLI 的访问凭证，可随时吊销、按配额限流")}
    <div class="bar"><button class="btn" id="issue-key">签发新 Key</button></div>
    <div class="card"><h3>Key 列表 <span class="sub">${keys.length} 个</span></h3>
      <table><thead><tr><th>Key</th><th>备注</th><th>配额</th><th>状态</th><th>创建时间</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6" class="empty">暂无 Key，点击右上角「签发新 Key」创建</td></tr>'}</tbody></table>
    </div>`;

  $("#issue-key").onclick = () => {
    openModal({
      title: "签发新 Key",
      okText: "签发",
      body:
        field("备注名", '<input id="m-k-name" placeholder="如：小明的 CLI" />') +
        field("配额（tokens，空 = 不限）", '<input id="m-k-quota" type="number" placeholder="1000000" />'),
      onOk: async (b) => {
        const quotaRaw = $("#m-k-quota", b).value;
        const k = await req("/api/keys", {
          method: "POST",
          body: JSON.stringify({
            name: $("#m-k-name", b).value.trim(),
            quotaTokens: quotaRaw ? Number(quotaRaw) : null,
          }),
        });
        openModal({
          title: "Key 已签发",
          body: `<p style="line-height:1.7">请立即复制，完整 Key 只显示这一次：</p><div class="key-show">${esc(k.key)}</div>`,
          okText: "我已保存",
          onOk: () => { navigator.clipboard?.writeText(k.key).catch(() => {}); renderTab(); },
        });
      },
    });
  };
  $$("[data-revoke]", c).forEach((btn) => (btn.onclick = () =>
    confirmBox("吊销 Key", "吊销后立即失效，使用该 Key 的调用将被拒绝。", async () => {
      await req(`/api/keys/${btn.dataset.revoke}`, { method: "DELETE" });
      toast("已吊销");
      renderTab();
    }, "吊销")));
}

/* ---------- 仓库 ---------- */
async function renderRepos(c) {
  const { repos } = await req("/api/repos");
  const rows = repos.map((r) => {
    const url = `${location.origin}/git/${r.group}/${r.name}.git`;
    const priv = r.visibility === "private";
    return `<tr>
      <td><b>${esc(r.group)}/${esc(r.name)}</b></td>
      <td><span class="tag ${priv ? "off" : "on"}">${priv ? "私有" : "团队"}</span></td>
      <td>${r.memberCount ?? 1} 人</td>
      <td>${fmtTime(r.createdAt)}</td>
      <td class="mono">${esc(url)} <span class="copy" data-copy="${esc(url)}">复制</span></td>
      <td>
        <button class="btn sm ghost" data-members="${r.id}" data-name="${esc(r.group)}/${esc(r.name)}">成员</button>
        <button class="btn sm ghost" data-vis="${r.id}" data-now="${r.visibility}">${priv ? "设为团队可见" : "设为私有"}</button>
        <button class="btn sm danger" data-del="${r.id}" data-name="${esc(r.group)}/${esc(r.name)}">删除</button>
      </td>
    </tr>`;
  }).join("");
  c.innerHTML = `
    ${pageHead("Git 仓库", "内置 Git 托管，smart HTTP 协议，凭 token 克隆/推送；私有仓库仅成员可见")}
    <div class="bar"><button class="btn" id="add-repo">新建仓库</button></div>
    <div class="card"><h3>仓库列表 <span class="sub">${repos.length} 个</span></h3>
      <table><thead><tr><th>仓库</th><th>可见性</th><th>成员</th><th>创建时间</th><th>地址</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6" class="empty">暂无仓库，点击右上角「新建仓库」创建</td></tr>'}</tbody></table>
      <div class="hint">克隆凭证格式：<span class="mono">http://&lt;邮箱&gt;:&lt;token&gt;@${location.host}/git/&lt;分组&gt;/&lt;仓库名&gt;.git</span>，token 可在客户端登录后获取。</div>
    </div>`;
  $("#add-repo").onclick = () => {
    openModal({
      title: "新建仓库",
      okText: "创建",
      body:
        field("分组", '<input id="m-r-group" value="default" />') +
        field("仓库名", '<input id="m-r-name" placeholder="my-project" />') +
        field("可见性", `<select id="m-r-vis">
          <option value="team">团队可见（全部成员可读写）</option>
          <option value="private">私有（仅仓库成员）</option>
        </select>`),
      onOk: async (b) => {
        const group = $("#m-r-group", b).value.trim();
        const name = $("#m-r-name", b).value.trim();
        if (!group || !name) { toast("分组与仓库名均必填", "err"); return false; }
        await req("/api/repos", { method: "POST", body: JSON.stringify({ group, name, visibility: $("#m-r-vis", b).value }) });
        toast("仓库已创建");
        renderTab();
      },
    });
  };
  $$("[data-copy]", c).forEach((el) => (el.onclick = () => {
    navigator.clipboard?.writeText(el.dataset.copy).then(() => toast("地址已复制")).catch(() => toast("复制失败", "err"));
  }));
  $$("[data-vis]", c).forEach((btn) => (btn.onclick = async () => {
    const next = btn.dataset.now === "private" ? "team" : "private";
    try {
      await req(`/api/repos/${btn.dataset.vis}/visibility`, { method: "PATCH", body: JSON.stringify({ visibility: next }) });
      toast(next === "private" ? "已设为私有，仅仓库成员可见" : "已设为团队可见");
      renderTab();
    } catch (e) { toast(e.message, "err", 3600); }
  }));
  $$("[data-members]", c).forEach((btn) => (btn.onclick = async () => {
    const repoId = btn.dataset.members;
    try {
      const [{ members }, { users }] = await Promise.all([
        req(`/api/repos/${repoId}/members`),
        req("/api/users"),
      ]);
      const memberIds = new Set(members.map((m) => m.userId));
      const candidates = users.filter((u) => !memberIds.has(u.id));
      const memberRows = members.map((m) => `
        <tr><td><b>${esc(m.name)}</b></td><td>${esc(m.email)}</td><td><span class="tag ${m.role === "owner" ? "on" : ""}">${m.role === "owner" ? "拥有者" : "成员"}</span></td>
        <td>${m.role === "owner" ? "" : `<button class="btn sm danger" data-rm-member="${m.userId}">移除</button>`}</td></tr>`).join("");
      openModal({
        title: `仓库成员：${btn.dataset.name}`,
        okText: "关闭",
        body: `
          <table style="margin-bottom:14px"><tbody>${memberRows}</tbody></table>
          ${candidates.length ? field("添加成员", `<select id="m-add-member">
            ${candidates.map((u) => `<option value="${u.id}">${esc(u.name)}（${esc(u.email)}）</option>`).join("")}
          </select>`) : '<p style="color:var(--text2);font-size:12px">全部成员都已在仓库中</p>'}
          <div class="hint">仓库成员可读写该仓库（含私有仓库）；移除后立即失去访问权限。</div>`,
        onOk: () => renderTab(),
      });
      const addSel = $("#m-add-member");
      if (addSel) {
        const foot = $(".m-foot", $("#modal-root"));
        const addBtn = document.createElement("button");
        addBtn.className = "btn";
        addBtn.textContent = "添加所选成员";
        addBtn.onclick = async () => {
          addBtn.disabled = true;
          try {
            await req(`/api/repos/${repoId}/members`, { method: "POST", body: JSON.stringify({ userId: addSel.value }) });
            toast("成员已添加");
            $("#modal-root").innerHTML = "";
            btn.onclick();
          } catch (e) { toast(e.message, "err", 3600); addBtn.disabled = false; }
        };
        foot.prepend(addBtn);
      }
      $$("[data-rm-member]", $("#modal-root")).forEach((rm) => (rm.onclick = async () => {
        try {
          await req(`/api/repos/${repoId}/members/${rm.dataset.rmMember}`, { method: "DELETE" });
          toast("成员已移除");
          $("#modal-root").innerHTML = "";
          btn.onclick();
        } catch (e) { toast(e.message, "err", 3600); }
      }));
    } catch (e) { toast(e.message, "err", 3600); }
  }));
  $$("[data-del]", c).forEach((btn) => (btn.onclick = () =>
    confirmBox("删除仓库", `删除「${btn.dataset.name}」？磁盘数据将一并删除，不可恢复。`, async () => {
      await req(`/api/repos/${btn.dataset.del}`, { method: "DELETE" });
      toast("仓库已删除");
      renderTab();
    }, "删除")));
}

/* ---------- 在线环境 ---------- */
async function renderEnvs(c) {
  const [{ envs }, { repos }] = await Promise.all([req("/api/envs?all=1"), req("/api/repos")]);
  const statusTag = (s) => s === "running" ? '<span class="tag run">运行中</span>'
    : s === "error" ? '<span class="tag off">异常退出</span>' : '<span class="tag">已停止</span>';
  const rows = envs.map((e) => `
    <tr>
      <td><b>${esc(e.name)}</b></td>
      <td>${esc(e.repoName || "-")}</td>
      <td>${esc(e.userName)}</td>
      <td class="mono">${esc(e.runCmd || "-")}</td>
      <td>${statusTag(e.status)}</td>
      <td>
        ${e.status === "running"
          ? `<button class="btn sm ghost" data-stop="${e.id}">停止</button>`
          : `<button class="btn sm ghost" data-start="${e.id}" ${e.runCmd ? "" : "disabled"}>启动</button>`}
        <button class="btn sm ghost" data-logs="${e.id}" data-name="${esc(e.name)}">日志</button>
        <button class="btn sm danger" data-del="${e.id}" data-name="${esc(e.name)}">删除</button>
      </td>
    </tr>`).join("");
  c.innerHTML = `
    ${pageHead("在线环境", "服务端上的隔离工作区：从仓库克隆代码，跑 dev server 或脚本")}
    <div class="bar"><button class="btn" id="add-env">新建环境</button></div>
    <div class="card"><h3>环境列表 <span class="sub">${envs.length} 个</span></h3>
      <table><thead><tr><th>名称</th><th>仓库</th><th>创建者</th><th>启动命令</th><th>状态</th><th>操作</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6" class="empty">暂无环境，点击右上角「新建环境」创建</td></tr>'}</tbody></table>
    </div>
    <div class="card" id="env-log-card" style="display:none"><h3 id="env-log-title">日志</h3><div class="logbox" id="env-log-body"></div></div>`;

  $("#add-env").onclick = () => {
    openModal({
      title: "新建环境",
      okText: "创建",
      body:
        field("环境名", '<input id="m-e-name" placeholder="前端 dev 环境" />') +
        field("从仓库克隆", `<select id="m-e-repo">
          <option value="">（空工作区）</option>
          ${repos.map((r) => `<option value="${r.id}">${esc(r.group)}/${esc(r.name)}</option>`).join("")}
        </select>`) +
        field("启动命令（可空）", '<input id="m-e-cmd" placeholder="npm run dev" />'),
      onOk: async (b) => {
        const name = $("#m-e-name", b).value.trim();
        if (!name) { toast("环境名必填", "err"); return false; }
        await req("/api/envs", {
          method: "POST",
          body: JSON.stringify({
            name,
            repoId: $("#m-e-repo", b).value || undefined,
            runCmd: $("#m-e-cmd", b).value.trim() || undefined,
          }),
        });
        toast("环境已创建");
        renderTab();
      },
    });
  };
  $$("[data-start]", c).forEach((b) => (b.onclick = () =>
    req(`/api/envs/${b.dataset.start}/start`, { method: "POST" }).then(() => { toast("已启动"); renderTab(); }).catch((e) => toast(e.message, "err"))));
  $$("[data-stop]", c).forEach((b) => (b.onclick = () =>
    req(`/api/envs/${b.dataset.stop}/stop`, { method: "POST" }).then(() => { toast("已停止"); renderTab(); }).catch((e) => toast(e.message, "err"))));
  $$("[data-del]", c).forEach((b) => (b.onclick = () =>
    confirmBox("删除环境", `删除「${b.dataset.name}」？工作区将被清除。`, async () => {
      await req(`/api/envs/${b.dataset.del}`, { method: "DELETE" });
      toast("环境已删除");
      renderTab();
    }, "删除")));
  $$("[data-logs]", c).forEach((b) => (b.onclick = async () => {
    const card = $("#env-log-card");
    card.style.display = "block";
    $("#env-log-title").textContent = `日志：${b.dataset.name}`;
    $("#env-log-body").textContent = "加载中…";
    card.scrollIntoView({ behavior: "smooth" });
    try {
      const { lines } = await req(`/api/envs/${b.dataset.logs}/logs?tail=300`);
      $("#env-log-body").textContent = lines.join("\n") || "（暂无日志）";
    } catch (e) { $("#env-log-body").textContent = `加载失败：${e.message}`; }
  }));
}

/* ---------- 审计 ---------- */
async function renderAudit(c) {
  const { logs } = await req("/api/admin/audit?limit=200");
  const ACTION_CN = {
    "auth.login": "登录", "auth.login_failed": "登录失败",
    "user.create": "创建成员", "provider.create": "添加 Provider", "provider.enable": "启用 Provider",
    "provider.disable": "停用 Provider", "provider.delete": "删除 Provider", "provider.update_models": "更新模型列表",
    "key.create": "签发 Key", "key.revoke": "吊销 Key",
    "repo.create": "创建仓库", "repo.delete": "删除仓库",
    "repo.visibility": "修改仓库可见性", "repo.member_add": "添加仓库成员", "repo.member_remove": "移除仓库成员",
    "env.create": "创建环境", "env.start": "启动环境", "env.stop": "停止环境", "env.delete": "删除环境",
    "file.delete": "删除文件",
  };
  const rows = logs.map((l) => `
    <tr>
      <td class="mono">${fmtTime(l.ts)}</td>
      <td>${esc(l.userEmail || "-")}</td>
      <td><span class="tag ${l.action.includes("failed") || l.action.includes("delete") || l.action.includes("revoke") ? "off" : "on"}">${esc(ACTION_CN[l.action] ?? l.action)}</span></td>
      <td>${esc(l.target || "-")}</td>
      <td class="mono" style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(l.detail)}">${esc(l.detail || "-")}</td>
      <td class="mono">${esc(l.ip || "-")}</td>
    </tr>`).join("");
  c.innerHTML = `
    ${pageHead("审计日志", "关键操作全量留痕：登录、密钥、仓库、环境等")}
    <div class="card"><h3>最近 ${logs.length} 条</h3>
      <table><thead><tr><th>时间</th><th>操作者</th><th>动作</th><th>对象</th><th>详情</th><th>IP</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6" class="empty">暂无日志</td></tr>'}</tbody></table>
    </div>`;
}

/* ---------- 启动 ---------- */
if (token) {
  fetch("/api/me", { headers: { authorization: `Bearer ${token}` } })
    .then((r) => (r.ok ? r.json() : Promise.reject()))
    .then((u) => { me = u; renderMain(); })
    .catch(() => renderLogin());
} else {
  renderLogin();
}
